<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Wake: moves and kills</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font: 14px system-ui, sans-serif;
        color: #f4efe2;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        max-width: 340px;
        padding: 8px;
        border-radius: 12px;
        background: rgb(10 6 24 / 0.75);
      }
      #panel h1 {
        grid-column: 1 / -1;
        margin: 0;
        font-size: 15px;
      }
      #panel button,
      #panel select {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #fff3;
        background: #2a1c52;
        color: inherit;
        font: inherit;
      }
      #panel select {
        grid-column: 1 / -1;
      }
      #log {
        grid-column: 1 / -1;
        font-size: 12px;
        color: #b7a9d6;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel"></div>
    <script type="module" src="./wake.ts"></script>
  </body>
</html>
