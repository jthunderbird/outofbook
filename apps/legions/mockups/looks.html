<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Looks lab</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        font:
          14px system-ui,
          sans-serif;
        color: #eee;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 2;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 10px;
        align-items: center;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgb(10 8 24 / 0.82);
        border: 1px solid #3a3260;
        max-width: calc(100vw - 40px);
      }
      #panel h1 {
        grid-column: 1 / -1;
        margin: 0 0 2px;
        font-size: 15px;
        color: #f2cf74;
      }
      #panel select {
        font: inherit;
        padding: 3px 6px;
        border-radius: 6px;
        background: #1c1838;
        color: #eee;
        border: 1px solid #4a4280;
      }
      #panel .hide {
        grid-column: 1 / -1;
        justify-self: end;
      }
      #panel.closed > :not(h1, .hide) {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel"></div>
    <script type="module" src="./looks.ts"></script>
  </body>
</html>
