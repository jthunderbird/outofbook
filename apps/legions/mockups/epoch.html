<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Epoch Drifters mockup</title>
    <style>
      html, body { margin: 0; height: 100%; background: #120d22; color: #f4efe2; font-family: ui-monospace, Menlo, Consolas, monospace; overflow: hidden; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #stage canvas { image-rendering: pixelated; max-width: 100vw; max-height: 100vh; }
      #stage canvas.gl { image-rendering: auto; width: 100vw; height: 100vh; max-width: none; max-height: none; }
      #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(10, 6, 24, 0.85)); justify-content: center; align-items: center; z-index: 5; }
      button { font: inherit; color: #f4efe2; background: #2c2358; border: 2px solid #7f6cd6; border-radius: 6px; padding: 8px 12px; cursor: pointer; min-height: 40px; }
      button.on { background: #7f6cd6; color: #120d22; font-weight: 700; }
      #say { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(10, 6, 24, 0.75); border: 2px solid #7f6cd6; border-radius: 6px; padding: 6px 14px; z-index: 5; text-align: center; max-width: 92vw; }
      #logo { position: fixed; left: 10px; top: 8px; width: min(26vw, 280px); z-index: 5; pointer-events: none; }
      #roster { position: fixed; right: 10px; top: 10px; z-index: 5; font-size: 12px; background: rgba(10, 6, 24, 0.7); border: 2px solid #7f6cd6; border-radius: 6px; padding: 6px 10px; line-height: 1.5; }
      @media (max-width: 800px) { #roster { display: none; } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <img id="logo" alt="Epoch Drifters" />
    <div id="say">Epoch Drifters: press Next move</div>
    <div id="roster"></div>
    <div id="bar"></div>
    <script type="module" src="./epoch.ts"></script>
  </body>
</html>
